<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
 <meta name="color-scheme" content="dark">
 <title>Live Performance — Hugo Sodré</title>
 <link rel="stylesheet" href="vision.css">
 <script defer src="assets.js"></script>
 <script defer src="splash-assets.js"></script>
 <script defer src="vision.js"></script>
</head>
<body>
 <div id="opening" class="opening" role="dialog" aria-modal="true" aria-label="Abertura do Live Performance" tabindex="0">
  <div id="opening-art" class="opening-art" role="img" aria-label="Live Performance by Hugo Sodré. Acessibilidade para baixa visão."></div>
  <p id="opening-status" class="sr-only" role="status" aria-live="polite">Preparando os instrumentos.</p>
 </div>
 <header class="topbar">
  <button id="brand" class="brand" aria-label="Live Performance — voltar à biblioteca">
   <span class="portrait"><img id="portrait" alt="Hugo Sodré"></span>
   <span><span class="brand-name">Live <strong>Performance</strong></span><span class="signature">by Hugo Sodré</span></span>
   <svg class="brand-wave" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 20v8m8-16v24m8-32v40m8-34v28m8-22v16m8-12v8"/></svg>
  </button>
  <nav aria-label="Navegação principal">
   <button data-screen="2"><span aria-hidden="true">▤</span>Performance</button>
   <button data-screen="3"><span aria-hidden="true">⚙</span>Áudio / MIDI</button>
   <button data-screen="4"><span aria-hidden="true">▣</span>Perfis</button>
   <button data-screen="5"><span aria-hidden="true">ⓘ</span>Sobre</button>
  </nav>
 </header>
 <div class="page-heading"><button id="back" aria-label="Voltar à biblioteca">‹ Biblioteca</button><div><p class="eyebrow" id="eyebrow">SUA BIBLIOTECA DE PALCO</p><h1 id="heading">Escolha a categoria <em>do instrumento</em></h1></div><button id="keyboard-nav" aria-label="Abrir teclado virtual, atalho K">Teclado · K</button></div>
 <main id="content" tabindex="-1" aria-labelledby="heading"><div class="waiting panel"><h2>Preparando seus instrumentos</h2><p>Conectando a interface ao Live Performance…</p><progress id="progress" max="100" value="0"></progress><p id="connection-message">O áudio permanece no motor nativo.</p></div></main>
 <div class="session-strip"><span id="profile-state" role="status" aria-live="polite">Perfil sem alterações pendentes</span><div class="meter-wrap"><meter id="output-meter" min="0" max="1" low="0.65" high="0.9" optimum="0.5" value="0" aria-label="Nível de saída"></meter><span id="peak-label">Saída: silêncio</span></div></div>
 <footer><div class="sound-status"><span id="audio-dot" class="dot"></span><div><strong id="loaded-name">Nenhum timbre carregado</strong><span id="status" role="status" aria-live="polite">Aguardando o motor.</span></div></div><button id="effects-nav">Parâmetros · E</button><button id="panic" class="panic" aria-label="Interromper todas as notas, atalho F12">Pânico · F12</button></footer>
 <div id="error" role="alert" hidden></div>
 <noscript>Esta interface precisa de JavaScript habilitado no WebView2.</noscript>
</body>
</html>
