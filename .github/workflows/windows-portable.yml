name: Windows portable (ASIO)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/windows-portable.yml'
jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PortAudio 19.7.0
        shell: pwsh
        run: |
          git clone --depth 1 --branch v19.7.0 https://github.com/PortAudio/portaudio.git "$env:RUNNER_TEMP/portaudio"
      - name: Prepare ASIO SDK
        shell: pwsh
        env:
          ASIO_SDK_ZIP_BASE64: ${{ secrets.ASIO_SDK_ZIP_BASE64 }}
        run: |
          if (-not $env:ASIO_SDK_ZIP_BASE64) { throw 'Configure ASIO_SDK_ZIP_BASE64 repository secret with the licensed Steinberg ASIO SDK ZIP (base64).' }
          $archive = Join-Path $env:RUNNER_TEMP 'asio-sdk.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($env:ASIO_SDK_ZIP_BASE64))
          $dest = Join-Path $env:RUNNER_TEMP 'asiosdk'
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          $header = Get-ChildItem $dest -Recurse -Filter asio.h | Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $header) { throw 'ASIO SDK archive must contain common/asio.h' }
          "ASIO_SDK_ROOT=$($header.Directory.Parent.FullName)" >> $env:GITHUB_ENV
      - name: Configure and compile Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DLP_PORTAUDIO_SOURCE=$env:RUNNER_TEMP/portaudio" "-DASIOSDK_ROOT_DIR=$env:ASIO_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target LivePerformance --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable
        shell: pwsh
        run: |
          $out = 'Live-Performance-by-Hugo-Sodre-Portable-Windows-x64'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'build/Release/LivePerformance.exe' $out
          foreach ($dll in @('sfizz.dll','sndfile.dll','SDL3.dll')) {
            $src = Join-Path 'recovery/extracted/live' $dll
            if (Test-Path $src) { Copy-Item $src $out }
          }
          if (Test-Path 'recovery/extracted/live/samples') { Copy-Item 'recovery/extracted/live/samples' (Join-Path $out 'samples') -Recurse }
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Performance-by-Hugo-Sodre-Portable-Windows-x64
          path: Live-Performance-by-Hugo-Sodre-Portable-Windows-x64.zip
          if-no-files-found: error
