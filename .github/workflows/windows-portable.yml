name: Windows portable ASIO build
# Portable builds are triggered only by explicit edits to this workflow on the
# current layout branch, or manually.
# Hosted build explicitly requested by the user; remaining usage allowance unknown. Avoid building on every source commit.
on:
  workflow_dispatch:
  push:
    branches:
      - layout/accessible-v1
    paths:
      - '.github/workflows/windows-portable.yml'

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PortAudio and Steinberg SDK
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch v19.7.0 https://github.com/PortAudio/portaudio.git "$env:RUNNER_TEMP/portaudio"
          Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile "$env:RUNNER_TEMP/asiosdk.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/asiosdk.zip" -DestinationPath "$env:RUNNER_TEMP/asiosdk" -Force
          $asio = Get-ChildItem "$env:RUNNER_TEMP/asiosdk" -Recurse -Filter asio.h | Where-Object { $_.Directory.Name -eq 'common' } | Select-Object -First 1
          if (-not $asio) { throw 'Steinberg ASIO SDK common/asio.h unavailable' }
          "ASIOSDK_ROOT=$($asio.Directory.Parent.FullName)" >> $env:GITHUB_ENV
      - name: Configure Windows ASIO executable
        shell: pwsh
        run: |
          cmake -S . -B build-portable -A x64 "-DLP_PORTAUDIO_SOURCE=$env:RUNNER_TEMP/portaudio" "-DASIOSDK_ROOT_DIR=$env:ASIOSDK_ROOT" -DLP_COPY_RECOVERED_ASSETS=ON
      - name: Compile full application
        run: cmake --build build-portable --config Release --target LivePerformance --parallel 2
      - name: Install FluidSynth runtime
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-fluidsynth mingw-w64-x86_64-binutils
      - name: Locate actual MSYS2 FluidSynth runtime
        shell: msys2 {0}
        run: |
          set -e
          test -f /mingw64/bin/libfluidsynth-3.dll
          test -f /mingw64/bin/objdump.exe
          cygpath -w /mingw64/bin > fluidsynth-bin-path.txt
          ls -l /mingw64/bin/libfluidsynth-3.dll
      - name: Download evaluated SF2 banks
        shell: pwsh
        run: python scripts/download_evaluation_sf2.py soundbank/sf2
      - name: Prepare small Windows portable
        shell: pwsh
        run: |
          $dest='portable/LivePerformance'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item 'build-portable/Release/LivePerformance.exe' $dest
          foreach($dll in @('sfizz.dll','sndfile.dll','SDL3.dll')) { Copy-Item "recovery/extracted/live/$dll" $dest }
          New-Item -ItemType Directory -Force "$dest/samples" | Out-Null
          foreach($name in @('CP80','Pianet T','Wurlitzer EP200')) { Copy-Item "recovery/extracted/live/samples/$name" "$dest/samples/$name" -Recurse }
          New-Item -ItemType Directory -Force "$dest/soundbank" | Out-Null
          Copy-Item 'soundbank/sf2' "$dest/soundbank/sf2" -Recurse
          $dllroot=(Get-Content 'fluidsynth-bin-path.txt' -Raw).Trim()
          if(-not (Test-Path (Join-Path $dllroot 'libfluidsynth-3.dll'))){throw "FluidSynth missing at actual MSYS2 location: $dllroot"}
          $queue=[System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue('libfluidsynth-3.dll')
          $seen=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          while($queue.Count -gt 0) {
            $dll=$queue.Dequeue()
            if(-not $seen.Add($dll)){continue}
            $source=Join-Path $dllroot $dll
            if(-not (Test-Path $source)){throw "FluidSynth dependency missing: $dll"}
            Copy-Item $source $dest
            $output=& (Join-Path $dllroot 'objdump.exe') -p $source
            foreach($line in $output){
              if($line -match 'DLL Name: *([^ ]+)'){
                $dependency=$Matches[1].Trim()
                if(Test-Path (Join-Path $dllroot $dependency)){$queue.Enqueue($dependency)}
              }
            }
          }
          if(-not (Test-Path "$dest/libfluidsynth-3.dll")){throw 'Missing FluidSynth runtime'}
          Set-Content -Path "$dest/LEIA-ME.txt" -Value 'Teste Windows ASIO: LivePerformance.exe com cinco bancos SF2 e tres SFZ recuperados. Outros SFZ aguardam amostras.' -Encoding UTF8
          Compress-Archive -Path "$dest/*" -DestinationPath 'LivePerformance-Layout-Atual-Windows-x64-Portatil.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: LivePerformance-Layout-Atual-Windows-x64-Portatil
          path: LivePerformance-Layout-Atual-Windows-x64-Portatil.zip
          retention-days: 7
